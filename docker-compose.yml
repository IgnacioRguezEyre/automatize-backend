# Infraestructura local para desarrollo. Arranca con: docker compose up -d
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: automatize-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en el archivo .env}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # La API de Empleos en un contenedor, igual que se desplegaría. Solo arranca si lo pides:
  #   docker compose --profile app up -d --build
  empleos-api:
    profiles: ["app"]
    build:
      context: services/empleos
    container_name: automatize-empleos-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Jobs: "Server=sqlserver,1433;Database=Jobs;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
    ports:
      - "5080:8080"

  # Integraciones: lee Gmail y manda las ofertas a la API de Empleos de arriba.
  # Las credenciales de Gmail se leen del .env (GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET, GMAIL_REFRESH_TOKEN).
  integraciones-api:
    profiles: ["app"]
    build:
      context: services/integraciones
    container_name: automatize-integraciones-api
    depends_on:
      - empleos-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Empleos__BaseUrl: "http://empleos-api:8080"
      Gmail__ClientId: ${GMAIL_CLIENT_ID:-}
      Gmail__ClientSecret: ${GMAIL_CLIENT_SECRET:-}
      Gmail__RefreshToken: ${GMAIL_REFRESH_TOKEN:-}
    ports:
      - "5090:8080"

volumes:
  sqlserver-data:
