# Infraestructura local para desarrollo. Arranca con: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: automatize-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-automatize}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: jobs
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d jobs"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
