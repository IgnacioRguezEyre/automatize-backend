# Pipeline del microservicio Empleos.
#  - CI (en cada push a dev/main y en cada pull request): compila, busca paquetes vulnerables y pasa los tests.
#  - Imagen Docker: se construye siempre para comprobar que el Dockerfile funciona; solo se publica
#    en GitHub Container Registry (ghcr.io) cuando el cambio llega a main.
#  - Despliegue (solo main): aplica las migraciones en Azure SQL y actualiza la API en Azure Container Apps.
name: Empleos CI

on:
  push:
    branches: [dev, main, "feature/**"]
    paths:
      - "services/empleos/**"
      - ".github/workflows/empleos-ci.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "services/empleos/**"
      - ".github/workflows/empleos-ci.yml"
  workflow_dispatch: # botón "Run workflow" para lanzarlo a mano

# Si llegan dos pushes seguidos a la misma rama, se cancela la ejecución vieja.
concurrency:
  group: empleos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: services/empleos

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Compilar y probar
    runs-on: ubuntu-latest # trae Docker, que necesitan los tests de integración (Testcontainers)
    timeout-minutes: 20
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar paquetes
        run: dotnet restore Empleos.slnx

      - name: Compilar
        run: dotnet build Empleos.slnx --no-restore --configuration Release

      - name: Buscar paquetes con vulnerabilidades
        run: |
          dotnet list Empleos.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Hay paquetes con vulnerabilidades conocidas. Revisa la salida de arriba."
            exit 1
          fi

      - name: Tests (dominio, aplicación e integración)
        run: >
          dotnet test Empleos.slnx --no-build --configuration Release
          --logger "trx;LogFilePrefix=results"
          --results-directory ${{ github.workspace }}/test-results

      - name: Resumen de los tests
        if: always()
        run: python3 ${{ github.workspace }}/.github/scripts/test-summary.py ${{ github.workspace }}/test-results

      - name: Guardar los resultados de los tests
        if: always() # también cuando fallan, que es cuando más se necesitan
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 14

  docker:
    name: Imagen Docker
    needs: build-and-test # solo si compila y los tests pasan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # para publicar en ghcr.io con el token automático de GitHub
    steps:
      - uses: actions/checkout@v4

      - name: Etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/automatize-empleos
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Iniciar sesión en ghcr.io
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir (y publicar si es main)
        uses: docker/build-push-action@v6
        with:
          context: services/empleos
          file: services/empleos/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Desplegar en Azure
    needs: docker
    # Solo en main y cuando Azure está preparado (variable AZURE_DEPLOY_ENABLED = true en el repositorio).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production # da acceso a los secrets de Azure y aparece en la pestaña Deployments
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: services/empleos
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-automatize' }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/automatize-empleos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Iniciar sesión en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Un "bundle" es un ejecutable con todas las migraciones dentro. Se aplica antes de cambiar la imagen,
      # para que la versión nueva de la API ya encuentre la base de datos actualizada.
      - name: Crear el bundle de migraciones
        env:
          ConnectionStrings__Jobs: "Server=placeholder;Database=Jobs" # solo para construir el modelo; no se conecta
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          dotnet ef migrations bundle --project src/Empleos.Infrastructure --startup-project src/Empleos.Api \
            --output efbundle --self-contained --target-runtime linux-x64 --force

      - name: Abrir el firewall de SQL a esta máquina
        id: firewall
        run: |
          SQL_SERVER=$(az sql server list -g "$RESOURCE_GROUP" --query "[0].name" -o tsv)
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "server=$SQL_SERVER" >> "$GITHUB_OUTPUT"
          az sql server firewall-rule create -g "$RESOURCE_GROUP" -s "$SQL_SERVER" \
            -n github-actions-${{ github.run_id }} --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" -o none

      - name: Aplicar las migraciones
        run: |
          ./efbundle --connection "Server=tcp:${{ steps.firewall.outputs.server }}.database.windows.net,1433;Database=Jobs;User Id=automatizeadmin;Password=${{ secrets.SQL_ADMIN_PASSWORD }};Encrypt=True;Connection Timeout=120"

      - name: Cerrar el firewall
        if: always() && steps.firewall.outputs.server != ''
        run: |
          az sql server firewall-rule delete -g "$RESOURCE_GROUP" -s "${{ steps.firewall.outputs.server }}" \
            -n github-actions-${{ github.run_id }} -o none

      - name: Desplegar la imagen nueva
        run: |
          az containerapp update -g "$RESOURCE_GROUP" -n empleos-api --image "$IMAGE:sha-${GITHUB_SHA::7}" -o none
          URL=$(az containerapp show -g "$RESOURCE_GROUP" -n empleos-api --query properties.configuration.ingress.fqdn -o tsv)
          echo "API desplegada en https://$URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Comprobar que responde
        run: |
          URL=$(az containerapp show -g "$RESOURCE_GROUP" -n empleos-api --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 12); do
            if curl -fsS "https://$URL/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "::error::La API no responde en /health tras el despliegue."
          exit 1

