# Crea o actualiza la infraestructura de Azure a partir de infra/azure/main.bicep.
# Se lanza a mano (pestaña Actions → "Infraestructura en Azure" → Run workflow): la infraestructura cambia poco
# y no conviene tocarla en cada push.
name: Infraestructura en Azure

on:
  workflow_dispatch:

permissions:
  id-token: write # para iniciar sesión en Azure con OIDC, sin guardar ninguna contraseña de Azure
  contents: read

jobs:
  deploy-infra:
    name: Desplegar Bicep
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Iniciar sesión en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Desplegar
        run: |
          az deployment group create \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP || 'rg-automatize' }} \
            --template-file infra/azure/main.bicep \
            --parameters sqlAdminPassword='${{ secrets.SQL_ADMIN_PASSWORD }}' apiKey='${{ secrets.API_KEY }}' \
            --query properties.outputs -o json
